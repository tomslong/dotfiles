# tmux Configuration - Easy to use

# Change prefix from Ctrl+b to Ctrl+a (easier to reach)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Reload config with r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Better splitting
bind | split-window -h -c "#{pane_current_path}"  # Vertical split (|)
bind - split-window -v -c "#{pane_current_path}"  # Horizontal split (-)

# Easy pane navigation with arrow keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Or use arrow keys (more intuitive)
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Resize panes with Ctrl+arrow
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D 5

# Create new window/tab in current path
bind c new-window -c "#{pane_current_path}"

# Switch windows with Alt+number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Or use Ctrl+a + number
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Close pane/window
bind x kill-pane
bind X kill-window

# Maximize/restore pane
bind z resize-pane -Z

# Easy window switching
bind n next-window
bind p previous-window
bind Tab last-window

# Rename window
bind , command-prompt -p "Window name:" "rename-window '%%'"

# Status bar styling
set -g status-position bottom
set -g status-bg '#1e1e1e'
set -g status-fg '#d4d4d4'
set -g status-left-length 50
set -g status-left ' #[fg=#0dbc79]#S #[default]|'
set -g status-right ' #[fg=#2472c8]%H:%M #[default]| #[fg=#cd3131]%Y-%m-%d'
set -g status-interval 1

# Window status
set -g window-status-format '#[fg=#666666]#I:#W#F'
set -g window-status-current-format '#[fg=#0dbc79,bold]#I:#W#F*'

# Pane borders
set -g pane-border-style 'fg=#333333 bg=default'
set -g pane-active-border-style 'fg=#0dbc79 bg=default'

# Message colors
set -g message-style 'fg=#d4d4d4 bg=#2472c8'

# Increase scrollback
set -g history-limit 10000

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Don't rename windows automatically
set-option -g allow-rename off

# Copy mode settings
setw -g mode-keys vi
bind Enter copy-mode

# Easy copy-paste in vi mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind P paste-buffer

# Auto-start tmux (uncomment next line to start tmux automatically)
# set -g status on
